<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="67 21 360 360"
     width="360"
     height="360"
     role="img"
     class="faro-logo"
     aria-labelledby="faro-title faro-desc">

  <!-- ============================================================
       FARO — ILUSTRACIÓN VECTORIAL
       Estructura pensada para animación.

       Grupos principales:
       #logo-scene      -> ilustración circular
       #sky            -> cielo / fondo de la escena
       #stars           -> estrellas
       #clouds          -> nubes
       #light-beam      -> haz de luz
       #island          -> rocas / isla
       #lighthouse      -> faro completo
       #water           -> mar / olas

       El borde de la escena no es una línea: es un degradado radial
       que desvanece la ilustración hacia afuera (#scene-fade), para
       que se integre en cualquier fondo sin un contorno duro.

       El fondo del SVG es TRANSPARENTE. El wordmark "FARO" vive
       aparte, en faro-word.svg.
       ============================================================ -->

  <title id="faro-title">Faro</title>
  <desc id="faro-desc">
    Ilustración vectorial animada de un faro iluminando sobre el mar.
  </desc>

  <!-- ============================================================
       DEFINICIONES
       ============================================================ -->
  <defs>

    <!-- Área circular de la ilustración -->
    <clipPath id="scene-clip">
      <circle cx="247" cy="201" r="165"/>
    </clipPath>

    <!-- Gradiente del cielo -->
    <linearGradient id="sky-gradient"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%"   stop-color="#061a2d"/>
      <stop offset="55%"  stop-color="#17324a"/>
      <stop offset="100%" stop-color="#f3bd68"/>
    </linearGradient>

    <!-- Gradiente del haz luminoso -->
    <linearGradient id="beam-gradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%"   stop-color="#fff9d8"/>
      <stop offset="35%"  stop-color="#ffeab0"/>
      <stop offset="100%" stop-color="#f0bd60" stop-opacity=".72"/>
    </linearGradient>

    <!-- Gradiente de la torre -->
    <linearGradient id="tower-gradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">
      <stop offset="0%"   stop-color="#c9ced0"/>
      <stop offset="45%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#aeb5b9"/>
    </linearGradient>

    <!-- Gradiente del mar -->
    <linearGradient id="water-gradient"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">
      <stop offset="0%"   stop-color="#082b45"/>
      <stop offset="100%" stop-color="#06182d"/>
    </linearGradient>

    <!-- Resplandor de la lámpara -->
    <filter id="light-glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Desvanecido suave del borde de la escena: opaca en el centro,
         se apaga antes de llegar al límite del círculo. Reemplaza el
         contorno duro por un borde que se integra con lo que haya
         detrás. -->
    <radialGradient id="scene-fade-gradient"
                    cx="50%"
                    cy="50%"
                    r="50%">
      <stop offset="0%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#fff" stop-opacity="1"/>
       <stop offset="85%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="90%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="95%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <mask id="scene-fade-mask"
          maskUnits="userSpaceOnUse"
          x="82"
          y="36"
          width="330"
          height="330">
      <circle cx="247" cy="201" r="165" fill="url(#scene-fade-gradient)"/>
    </mask>

  </defs>


  <!-- ============================================================
       ESTILO
       Animaciones del faro. Todo queda scopeado bajo .faro-logo
       para no filtrarse a otros SVG de la página.
       ============================================================ -->
  <style>
    .faro-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    .faro-logo #light-beam {
      transform-origin: 194px 146px;
      animation: faro-beam-rotate 7s linear infinite;
    }

    .faro-logo #beam-glow,
    .faro-logo #lamp {
      animation: faro-lamp-pulse 2.4s ease-in-out infinite;
    }

    .faro-logo #wave-main {
      animation: faro-wave-drift 4s ease-in-out infinite;
    }

    .faro-logo #wave-secondary {
      animation: faro-wave-drift 4.6s ease-in-out infinite;
      animation-delay: .3s;
    }

    .faro-logo #stars circle {
      animation: faro-twinkle 3.2s ease-in-out infinite;
    }

    .faro-logo #star-01 { animation-delay: 0s; }
    .faro-logo #star-02 { animation-delay: .5s; }
    .faro-logo #star-03 { animation-delay: 1s; }
    .faro-logo #star-04 { animation-delay: 1.5s; }
    .faro-logo #star-05 { animation-delay: .8s; }
    .faro-logo #star-06 { animation-delay: 2s; }
    .faro-logo #star-07 { animation-delay: .3s; }
    .faro-logo #star-gold { animation-delay: .6s; animation-duration: 2.6s; }

    @keyframes faro-beam-rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes faro-lamp-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .7; }
    }

    @keyframes faro-wave-drift {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(2px); }
    }

    @keyframes faro-twinkle {
      0%, 100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    @media (prefers-reduced-motion: reduce) {
      .faro-logo #light-beam,
      .faro-logo #beam-glow,
      .faro-logo #lamp,
      .faro-logo #wave-main,
      .faro-logo #wave-secondary,
      .faro-logo #stars circle {
        animation: none;
      }
    }
  </style>


  <!-- ============================================================
       ESCENA CIRCULAR
       Todo lo que pertenece a la ilustración está dentro de este
       grupo y se recorta automáticamente al círculo.
       ============================================================ -->
  <g id="logo-scene"
     data-part="scene"
     clip-path="url(#scene-clip)"
     mask="url(#scene-fade-mask)">


    <!-- ==========================================================
         CIELO
         ========================================================== -->
    <g id="sky"
       data-part="sky">

      <rect x="82"
            y="36"
            width="330"
            height="330"
            fill="url(#sky-gradient)"/>

    </g>


    <!-- ==========================================================
         ESTRELLAS
         Cada estrella está separada para permitir animaciones.
         ========================================================== -->
    <g id="stars"
       data-part="stars"
       fill="#ffffff">

      <circle id="star-01" cx="134" cy="126" r="2.1"/>
      <circle id="star-02" cx="195" cy="85"  r="1.7"/>
      <circle id="star-03" cx="242" cy="101" r="1.5"/>
      <circle id="star-04" cx="298" cy="76"  r="2.1"/>
      <circle id="star-05" cx="369" cy="147" r="1.4"/>
      <circle id="star-06" cx="273" cy="91"  r="1.1"/>
      <circle id="star-07" cx="182" cy="111" r="1.2"/>
      <circle id="star-08" cx="119" cy="159" r="1.4"/>

      <!-- Estrella dorada -->
      <circle id="star-gold"
              cx="340"
              cy="100"
              r="1.8"
              fill="#f7c95c"/>

    </g>


    <!-- ==========================================================
         NUBES
         ========================================================== -->
    <g id="clouds"
       data-part="clouds"
       fill="#557087"
       opacity=".48">

      <path id="cloud-left"
            d="
              M82 180
              C92 172 101 174 106 176
              C111 168 124 173 127 180
              C136 178 143 184 146 190
              L82 190 Z"/>

      <path id="cloud-right"
            d="
              M318 245
              C327 237 338 238 343 241
              C349 232 363 238 366 245
              C375 242 385 248 389 254
              L318 254 Z"/>

    </g>


    <!-- ==========================================================
         HAZ DE LUZ
         Separado para poder rotar / encender / apagar.
         ========================================================== -->
    <g id="light-beam"
       data-part="light-beam">

      <!-- Resplandor exterior -->
      <path id="beam-glow"
            d="
              M194 146
              L410 91
              L410 202 Z"
            fill="#ffe8a6"
            opacity=".18"
            filter="url(#light-glow)"/>

      <!-- Haz principal -->
      <path id="beam"
            d="
              M194 145
              L410 91
              L410 202 Z"
            fill="url(#beam-gradient)"/>

    </g>


    <!-- ==========================================================
         HORIZONTE / LUZ DE ATARDECER
         ========================================================== -->
    <g id="horizon"
       data-part="horizon">

      <path id="horizon-glow"
            d="
              M82 300
              C139 287 185 292 228 301
              C281 311 327 297 412 304
              L412 366
              L82 366 Z"
            fill="#dcae67"
            opacity=".42"/>

    </g>


    <!-- ==========================================================
         ISLA / ROCAS
         ========================================================== -->
    <g id="island"
       data-part="island">

      <path id="island-base"
            d="
              M117 316
              C132 304 146 300 158 296
              C171 292 183 295 193 301
              C206 296 224 302 238 311
              L270 337
              L113 337 Z"
            fill="#071b30"/>

      <path id="island-highlight"
            d="
              M129 318
              C148 307 166 309 182 315
              C198 306 219 312 238 322
              L253 337
              L116 337 Z"
            fill="#0c2941"/>

    </g>


    <!-- ==========================================================
         FARO
         Grupo general del faro.
         ========================================================== -->
    <g id="lighthouse"
       data-part="lighthouse">


      <!-- ========================================================
           BASE
           ======================================================== -->
      <g id="lighthouse-base"
         data-part="lighthouse-base">

        <path id="base-platform"
              d="
                M157 289
                L232 289
                L243 311
                L146 311 Z"
              fill="#d7d9d8"/>

        <path id="base-shadow"
              d="
                M151 306
                L239 306
                L248 318
                L143 318 Z"
              fill="#0a2135"/>

      </g>


      <!-- ========================================================
           TORRE
           ======================================================== -->
      <g id="lighthouse-tower"
         data-part="lighthouse-tower">

        <!-- Cuerpo -->
        <path id="tower-body"
              d="
                M168 289
                L177 184
                L218 184
                L227 289 Z"
              fill="url(#tower-gradient)"/>

        <!-- Sombra izquierda -->
        <path id="tower-left-shadow"
              d="
                M183 184
                L189 286
                L168 289
                L177 184 Z"
              fill="#b7bdc0"
              opacity=".65"/>

        <!-- Sombra derecha -->
        <path id="tower-right-shadow"
              d="
                M218 184
                L227 289
                L213 286
                L211 184 Z"
              fill="#8f989d"
              opacity=".35"/>

      </g>


      <!-- ========================================================
           PUERTA
           ======================================================== -->
      <g id="lighthouse-door"
         data-part="lighthouse-door">

        <path id="door"
              d="
                M190 276
                L190 250
                Q190 242 198 242
                Q206 242 206 250
                L206 276 Z"
              fill="#061a2d"/>

        <!-- Reflejo -->
        <path id="door-highlight"
              d="
                M196 255
                L196 247
                Q196 245 198 245
                Q200 245 200 247
                L200 255 Z"
              fill="#d9dde0"/>

      </g>


      <!-- ========================================================
           VENTANA DE LA TORRE
           ======================================================== -->
      <g id="lighthouse-window"
         data-part="lighthouse-window">

        <path id="tower-window"
              d="
                M193 226
                L193 212
                Q193 207 198 207
                Q203 207 203 212
                L203 226 Z"
              fill="#071a2d"/>

        <path id="window-vertical"
              d="M198 209 V224"
              stroke="#e6e9e9"
              stroke-width="1.3"/>

        <path id="window-horizontal"
              d="M194 217 H202"
              stroke="#e6e9e9"
              stroke-width="1.3"/>

      </g>


      <!-- ========================================================
           BALCÓN
           ======================================================== -->
      <g id="lighthouse-balcony"
         data-part="lighthouse-balcony">

        <path id="balcony-floor"
              d="M166 165 H228"
              stroke="#0a1e31"
              stroke-width="4"/>

        <path id="balcony-rail-top"
              d="M168 157 H226"
              stroke="#d9dcda"
              stroke-width="3"/>

        <g id="balcony-rail-posts">
          <path id="rail-post-01" d="M171 157 V165"/>
          <path id="rail-post-02" d="M177 157 V165"/>
          <path id="rail-post-03" d="M183 157 V165"/>
          <path id="rail-post-04" d="M213 157 V165"/>
          <path id="rail-post-05" d="M219 157 V165"/>
          <path id="rail-post-06" d="M225 157 V165"/>
        </g>

      </g>


      <!-- ========================================================
           LINTERNA
           ======================================================== -->
      <g id="lighthouse-lantern"
         data-part="lighthouse-lantern">

        <!-- Soporte -->
        <rect id="lantern-support"
              x="171"
              y="151"
              width="53"
              height="8"
              rx="2"
              fill="#0b1e31"/>

        <!-- Estructura exterior -->
        <rect id="lantern-frame"
              x="176"
              y="123"
              width="43"
              height="31"
              rx="4"
              fill="#0b2032"
              stroke="#d5d8d7"
              stroke-width="2"/>

        <!-- Luz -->
        <g id="lantern-light"
           data-part="lantern-light">

          <rect id="lamp"
                x="182"
                y="128"
                width="31"
                height="23"
                rx="2"
                fill="#fff3bd"
                opacity=".95"/>

          <rect id="lamp-left-bar"
                x="186"
                y="128"
                width="5"
                height="23"
                fill="#6e7375"
                opacity=".75"/>

          <rect id="lamp-right-bar"
                x="204"
                y="128"
                width="5"
                height="23"
                fill="#6e7375"
                opacity=".75"/>

        </g>


        <!-- Techo -->
        <path id="lantern-roof"
              d="
                M176 126
                L198 106
                L219 126 Z"
              fill="#12283a"
              stroke="#d9dcdb"
              stroke-width="2"/>


        <!-- Capuchón superior -->
        <path id="lantern-top"
              d="
                M184 112
                L198 102
                L211 112 Z"
              fill="#091a2b"/>


        <!-- Varilla -->
        <path id="lantern-finial"
              d="M198 102 V96"
              stroke="#d7dbd9"
              stroke-width="2"/>


        <circle id="lantern-finial-dot"
                cx="198"
                cy="95"
                r="2"
                fill="#d7dbd9"/>

      </g>

    </g>


    <!-- ==========================================================
         MAR
         Las olas están separadas para poder animarlas
         independientemente.
         ========================================================== -->
    <g id="water"
       data-part="water">

      <!-- Masa principal -->
      <path id="water-body"
            d="
              M82 327
              C119 311 146 317 173 329
              C202 342 222 340 251 327
              C282 313 308 318 337 330
              C364 341 388 340 412 326
              L412 366
              L82 366 Z"
            fill="url(#water-gradient)"/>

      <!-- Ola principal -->
      <path id="wave-main"
            d="
              M82 341
              C117 329 142 331 169 341
              C195 351 218 353 245 341
              C273 328 299 331 327 342
              C356 353 386 351 412 338"
            fill="none"
            stroke="#254d68"
            stroke-width="5"
            opacity=".9"/>

      <!-- Ola secundaria -->
      <path id="wave-secondary"
            d="
              M88 349
              C122 341 148 345 174 352
              C199 359 218 359 244 351
              C270 342 297 345 325 354
              C354 364 381 360 405 351"
            fill="none"
            stroke="#0d3956"
            stroke-width="3"/>

      <!-- Línea inferior -->
      <path id="water-bottom"
            d="M82 359 H412 V366 H82 Z"
            fill="#06182d"/>

    </g>

  </g>

</svg>
