<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 470 120"
  role="img"
  aria-labelledby="faro-wordmark-title"
>
  <title id="faro-wordmark-title">FARO</title>

  <style>
    .faro-wordmark {
      fill: #071a2d;
      font-family: Montserrat, Poppins, Arial, sans-serif;
      font-size: 119px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    @media (prefers-color-scheme: dark) {
      .faro-wordmark {
        fill: #f5f5f4;
      }
    }

    .faro-accent {
      fill: #f6bd55;
    }
  </style>

  <g id="wordmark" class="faro-wordmark">
    <text x="19" y="101">F</text>
    <text x="120" y="101">A</text>
    <text x="238" y="101">R</text>
    <text x="352" y="101">O</text>
  </g>

  <circle
    id="accent-dot"
    class="faro-accent"
    cx="162"
    cy="81"
    r="10"
  />
</svg>