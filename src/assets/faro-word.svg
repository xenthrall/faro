<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 470 120"
  role="img"
  class="faro-wordmark-logo"
  aria-labelledby="faro-wordmark-title"
>
  <title id="faro-wordmark-title">FARO</title>

  <style>
    .faro-wordmark-logo {
      display: block;
      height: 100%;
      width: auto;
    }

    .faro-wordmark {
      fill: #071a2d;
      font-family: Montserrat, Poppins, Arial, sans-serif;
      font-size: 119px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    /*
      El tema lo decide la clase .dark del elemento raiz, y nada mas.
      Deliberadamente NO hay un @media prefers-color-scheme aca.

      El script de index.html ya resuelve la preferencia del sistema y la
      eleccion guardada en esa unica clase antes de que React monte. Una media
      query en este archivo volveria a decidir por su cuenta y se contradiria
      con esa decision: con el sistema en oscuro y el usuario en tema claro,
      .dark esta ausente (correcto) pero la media query igual pintaba la
      palabra de blanco, es decir blanco sobre fondo claro, ilegible.

      Como el SVG se inserta en el DOM y no se carga como imagen, este selector
      alcanza a ver la clase del ancestro. Si alguna vez se usara fuera del
      panel, el color por defecto de arriba es el oscuro, legible sobre claro.

      OJO: nada de signos de menor o mayor dentro de este comentario. El SVG se
      parsea como contenido foraneo, donde style no es texto crudo: un menor-que
      abre una etiqueta y parte el bloque de estilos en dos.
    */
    .dark .faro-wordmark {
      fill: #f5f5f4;
    }

    .faro-accent {
      fill: #f6bd55;
    }
  </style>

  <g id="wordmark" class="faro-wordmark">
    <text x="19" y="101">F</text>
    <text x="120" y="101">A</text>
    <text x="238" y="101">R</text>
    <text x="352" y="101">O</text>
  </g>

  <circle
    id="accent-dot"
    class="faro-accent"
    cx="162"
    cy="81"
    r="10"
  />
</svg>
