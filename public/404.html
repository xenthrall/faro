<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Faro</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so a direct visit or
      // refresh on a deep route (e.g. /faro/app/users) 404s here. Encode the
      // path into a query string and redirect to the app shell, which
      // index.html decodes back into the real URL before React mounts.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
